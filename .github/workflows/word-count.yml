# ZpDIC留為辞典の収録語数を調べて、index.html の「語彙数」欄を書き換える。
# APIキーはリポジトリの Secrets に ZPDIC_API_KEY という名前で登録しておく。
name: 語彙数の自動更新

on:
  # 毎日 日本時間の朝3時（GitHubの時刻は世界標準時なので18時と書く）
  schedule:
    - cron: "0 18 * * *"
  # Actions の画面から手動でも動かせるようにする
  workflow_dispatch:
  # index.html を上げ直したときも、すぐに最新の語数に直す
  push:
    paths:
      - "index.html"

permissions:
  contents: write

concurrency: word-count

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZpDICから語数を取得してindex.htmlに書き込む
        env:
          ZPDIC_API_KEY: ${{ secrets.ZPDIC_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request

          # 単語名が「空文字から始まる」語を探す＝全語が当たる。total が検索結果の総数
          url = ("https://zpdic.ziphil.com/api/v1/dictionary/ruwish_dictionary/words"
                 "?text=&mode=spelling&type=prefix&limit=1")
          request = urllib.request.Request(url, headers={
              "X-Api-Key": os.environ["ZPDIC_API_KEY"],
              "User-Agent": "ruwi-368.github.io word-count",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              total = json.load(response)["total"]
          if not isinstance(total, int) or total <= 0:
              raise SystemExit(f"語数がおかしいので書き換えません: {total!r}")
          print(f"ZpDICの語数: {total}")

          path = "index.html"
          html = open(path, encoding="utf-8").read()
          new_html, count = re.subn(
              r'(<div class="value" id="word-count">)[^<]*(</div>)',
              rf"\g<1>{total:,}語\g<2>",
              html,
          )
          if count != 1:
              raise SystemExit('index.html に id="word-count" の欄が見つかりません')
          if new_html != html:
              open(path, "w", encoding="utf-8").write(new_html)
          EOF

      - name: 語数が変わっていたら保存する
        run: |
          if git diff --quiet; then
            echo "語数は変わっていません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "語彙数を自動更新"
          git push
          
